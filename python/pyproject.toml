[project]
name = "studio-manim"
version = "0.1.0"
description = "Studio helpers for Manim Community: render instrumentation and narration sync."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["manim>=0.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_manim"]
