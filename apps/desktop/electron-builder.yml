appId: com.apollo.board
productName: Apollo Board
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # Board drives the teacher's own installed `claude`, so the SDK's bundled CLI binary isn't needed.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/esbuild/**
  - node_modules/@esbuild/**
  - node_modules/onnxruntime-node/**
extraResources:
  # Flat copy made by scripts/vendor-lab-kit.mjs (pnpm's symlinked layout can't be shipped as-is).
  - from: build/lab-kit.tgz
    to: lab-kit.tgz
  - from: ../../packages/agent-kit/guides
    to: guides
  - from: ../../python
    to: python
# Releases are uploaded to GitHub by hand or CI; the app itself never checks for updates.
publish:
  provider: github
  owner: daniyal-sh
  repo: board
win:
  target: [nsis]
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg, zip]
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v3/{win32,linux}/**"
  category: public.app-category.education
  # No Apple certificate yet: ad-hoc sign so Apple Silicon Macs can open it (right-click > Open the
  # first time). Remove these two lines once CSC_LINK is set up for real signing and notarization.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Board records your voice for narration. Recordings stay on this computer.
linux:
  target: [AppImage, deb]
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v3/{win32,darwin}/**"
  category: Education
  maintainer: The Apollo team
  vendor: Apollo
