name: Release
# Push a tag like v0.1.0 to build installers for Windows, macOS and Linux and attach them to a
# GitHub Release. The desktop app checks that release feed for auto-updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # Board runs its voice models on the CPU; the CUDA download 404s on Linux runners.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: pnpm --filter @studio/desktop vendor
      - run: pnpm --filter @studio/desktop build
      - run: pnpm --filter @studio/desktop exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing (add these secrets when you have certificates):
          # CSC_LINK / CSC_KEY_PASSWORD (macOS, Windows), APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarization)
